<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deals & Products</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">

  <div class="max-w-[1800px] mx-auto">
    <!-- Header Section -->
    <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">Vine Live Catalog</h1>
        <p class="text-sm text-gray-500">Auto-synced with GitHub Data Store</p>
      </div>
      <button onclick="loadProducts()" class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
        🔄 Refresh Catalog
      </button>
    </div>

    <!-- Product Grid (6 per row on large screens) -->
    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-4">
      <!-- Products will be loaded here dynamically -->
      <p class="col-span-full text-center text-gray-500 py-10">Products load ho rahe hain...</p>
    </div>
  </div>

  <script>
    const FILE_PATH = 'data.json';
    let currentProducts = [];

    // Data Load Function
    async function loadProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-10">Refreshing catalog...</p>`;

      try {
        // Cache bypass karne ke liye timestamp query parameter
        const response = await fetch(`./${FILE_PATH}?t=${Date.now()}`);
        if (!response.ok) throw new Error("Data fail");
        currentProducts = await response.json();

        // Newest First Sort (Naya Product Sabse Pehle/Top Par)
        currentProducts.sort((a, b) => {
          const timeA = new Date(a.createdAt || a.firstSeenAt || 0).getTime();
          const timeB = new Date(b.createdAt || b.firstSeenAt || 0).getTime();
          return timeB - timeA;
        });

        renderGrid();
      } catch (err) {
        grid.innerHTML = `<p class="col-span-full text-center text-red-500 py-10">Data load nahi ho paaya. Check karein ki data.json file exist karti hai ya nahi.</p>`;
      }
    }

    function renderGrid() {
      const grid = document.getElementById('productGrid');
      if (!currentProducts || currentProducts.length === 0) {
        grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-10">Koi product nahi mila.</p>`;
        return;
      }

      grid.innerHTML = currentProducts.map(p => {
        const title = p.title || 'Amazon Vine Product';
        const img = p.image || 'https://via.placeholder.com/200';
        const price = p.price && p.price !== "0" ? `₹${p.price}` : 'Free (Vine)';
        const mrp = p.mrp && p.mrp !== "0" ? `₹${p.mrp}` : null;
        const timeBadge = p.firstSeenAt || '';

        return `
          <div class="bg-white rounded-xl shadow-sm hover:shadow-md border border-gray-200 overflow-hidden flex flex-col justify-between transition relative">
            ${timeBadge ? `<span class="absolute top-2 right-2 bg-green-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-md shadow">${timeBadge}</span>` : ''}
            <div>
              <div class="h-44 bg-gray-50 p-4 flex items-center justify-center">
                <img src="${img}" alt="${title}" class="max-h-full max-w-full object-contain">
              </div>
              <div class="p-3">
                <h3 class="text-xs font-semibold text-gray-800 line-clamp-2 mb-2" title="${title}">${title}</h3>
                <div class="flex items-baseline gap-2 mb-2">
                  <span class="text-base font-bold text-green-700">${price}</span>
                  ${mrp ? `<span class="text-xs text-gray-400 line-through">${mrp}</span>` : ''}
                </div>
              </div>
            </div>
            <div class="p-3 pt-0">
              <a href="${p.url}" target="_blank" class="block text-center bg-amber-400 hover:bg-amber-500 text-gray-900 text-xs font-bold py-2 px-3 rounded-lg transition">
                Buy / View Now
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    // Initial Load
    loadProducts();
  </script>
</body>
</html>
